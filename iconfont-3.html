<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>移动端底部导航 · 字体图标</title>
    <!-- 课程 font 目录 iconfont 字体（字体图标方式源） -->
    <link rel="stylesheet" href="img/font/iconfont.css">
    <!-- Font Awesome Free（补足 4 个导航图标） -->
    <link rel="stylesheet" href="cdn/fa-all.min.css">
    <style>
        :root {
            --wy-bg:        #F2F1EC;   /* 米白纸质底 */
            --wy-ink:       #1B1C22;   /* 墨 */
            --wy-muted:     #8A887E;   /* 次级灰 */
            --wy-rule:      #E0DED5;   /* 极浅分线 */
            --wy-card:      #FFFFFF;   /* 卡片白 */
            --wy-accent:    #2D4A6F;   /* 深蓝 active accent */
            --wy-accent-2:  #3D6B9A;   /* 浅蓝 hover */
            --wy-badge:     #E14C4C;   /* 徽章红 */
            --wy-nav-bg:    rgba(255,255,255,0.96);
            --wy-nav-border:#E6E4DC;
            --wy-safe:      env(safe-area-inset-bottom, 0px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            background: var(--wy-bg);
            color: var(--wy-ink);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                         "Microsoft YaHei", system-ui, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        /* —— 手机容器：自适应宽度居中 —— */
        .wy_phone {
            width: min(480px, 100%);
            margin: 0 auto;
            min-height: 100vh;
            background: var(--wy-bg);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* —— 顶部状态栏 —— */
        .wy_status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px 4px;
            font-family: -apple-system, "Helvetica Neue", "SF Pro Text", sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--wy-ink);
            background: var(--wy-bg);
        }
        .wy_status-bar span:first-child { font-variant-numeric: tabular-nums; }

        /* —— 标题栏 —— */
        .wy_header {
            padding: 12px 20px 16px;
            background: var(--wy-bg);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .wy_header-title {
            font-size: 22px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.01em;
        }

        .wy_header-sub {
            margin: 4px 0 0;
            font-size: 13px;
            color: var(--wy-muted);
        }

        .wy_header-meta {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--wy-muted);
        }

        .wy_header-meta a {
            border-bottom: 1px solid var(--wy-accent);
            padding-bottom: 1px;
            color: var(--wy-accent);
            font-weight: 600;
        }

        /* —— 主内容区 —— */
        .wy_content {
            flex: 1;
            padding: 4px 16px calc(96px + var(--wy-safe) + 4px);
            background: var(--wy-bg);
        }

        /* 轮播卡 */
        .wy_banner {
            width: 100%;
            height: 160px;
            border-radius: 14px;
            background: linear-gradient(135deg, #2D4A6F 0%, #3D6B9A 60%, #6CA7C8 100%);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            padding: 18px 20px;
            color: #fff;
        }
        .wy_banner::before {
            content: "";
            position: absolute;
            right: -40px; top: -40px;
            width: 180px; height: 180px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
        }
        .wy_banner h3 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            position: relative;
        }
        .wy_banner p {
            margin: 4px 0 0;
            font-size: 13px;
            opacity: 0.88;
            position: relative;
        }

        /* 功能宫格 */
        .wy_grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-bottom: 24px;
        }

        .wy_grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 14px 0;
        }
        .wy_grid-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: var(--wy-card);
            display: flex; align-items: center; justify-content: center;
            color: var(--wy-accent);
            font-size: 20px;
        }
        .wy_grid-label {
            font-size: 11.5px;
            color: var(--wy-muted);
        }

        /* 列表卡片 */
        .wy_list-title {
            font-size: 15px;
            font-weight: 700;
            margin: 0 0 10px;
            padding-left: 4px;
            border-left: 3px solid var(--wy-accent);
        }

        .wy_list {
            background: var(--wy-card);
            border-radius: 12px;
            overflow: hidden;
        }

        .wy_list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--wy-rule);
        }
        .wy_list-item:last-child { border-bottom: none; }

        .wy_list-avatar {
            width: 44px; height: 44px;
            border-radius: 10px;
            background: var(--wy-bg);
            display: flex; align-items: center; justify-content: center;
            color: var(--wy-accent-2);
            font-size: 18px;
            flex-shrink: 0;
        }

        .wy_list-body { flex: 1; min-width: 0; }
        .wy_list-body h4 { margin: 0; font-size: 14.5px; font-weight: 600; color: var(--wy-ink); }
        .wy_list-body p {
            margin: 3px 0 0;
            font-size: 12.5px;
            color: var(--wy-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .wy_list-time {
            font-size: 11px;
            color: var(--wy-muted);
            flex-shrink: 0;
        }

        /* —— 底部导航（固定）—— */
        .wy_tabbar {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            z-index: 50;
            display: flex;
            justify-content: center;
            padding-bottom: var(--wy-safe);
        }

        .wy_tabbar-inner {
            width: min(480px, 100%);
            display: flex;
            background: var(--wy-nav-bg);
            backdrop-filter: saturate(180%) blur(18px);
            -webkit-backdrop-filter: saturate(180%) blur(18px);
            border-top: 0.5px solid var(--wy-nav-border);
            box-shadow: 0 -1px 0 rgba(0,0,0,0.02), 0 -8px 24px rgba(0,0,0,0.04);
        }

        .wy_tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 8px 0 calc(10px + var(--wy-safe) * 0.5);
            position: relative;
            color: var(--wy-muted);
            cursor: pointer;
            transition: color .15s ease;
            border: none;
            background: transparent;
            font: inherit;
        }

        .wy_tab:active { opacity: 0.7; }

        .wy_tab i {
            font-size: 22px;
            line-height: 1;
            position: relative;
            transition: color .15s ease, transform .15s ease;
        }

        .wy_tab-label {
            font-size: 10.5px;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        /* 激活态 */
        .wy_tab.is-active {
            color: var(--wy-accent);
        }
        .wy_tab.is-active i { font-weight: 900; transform: scale(1.05); }
        .wy_tab.is-active .wy_tab-label { font-weight: 700; }

        /* 徽章：数字徽章（右上角） */
        .wy_badge {
            position: absolute;
            top: 3px;
            left: calc(50% + 10px);
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            background: var(--wy-badge);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            line-height: 16px;
            text-align: center;
            border-radius: 8px;
            box-sizing: border-box;
            z-index: 2;
        }
        .wy_badge--dot {
            width: 8px; height: 8px;
            min-width: 8px; padding: 0;
            border-radius: 50%;
            top: 5px; left: calc(50% + 12px);
            box-shadow: 0 0 0 2px var(--wy-nav-bg);
        }

        /* —— 首页链接 —— */
        .wy_back {
            position: fixed;
            top: 16px; left: 16px;
            z-index: 100;
            padding: 6px 12px;
            background: var(--wy-card);
            border: 1px solid var(--wy-rule);
            border-radius: 20px;
            font-size: 12px;
            color: var(--wy-accent);
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        @media (min-width: 481px) {
            .wy_tabbar { box-shadow: 0 -1px 0 rgba(0,0,0,0.02), 0 -8px 24px rgba(0,0,0,0.04); }
        }
    </style>
</head>

<body>
    <a href="index.html" class="wy_back">← 返回首页</a>

    <!-- 手机容器 -->
    <div class="wy_phone">

        <!-- 状态栏 -->
        <div class="wy_status-bar">
            <span>9:41</span>
            <span>●●●●</span>
        </div>

        <!-- 标题栏 -->
        <header class="wy_header">
            <h1 class="wy_header-title">首页</h1>
            <p class="wy_header-sub">底部导航栏示例 · 4 个 Tab · 字体图标方式</p>
            <div class="wy_header-meta">
                <span>课程演示 · Font Awesome</span>
                <a href="iconfont-4.html">SVG 版本 →</a>
            </div>
        </header>

        <!-- 主内容区（滚动） -->
        <main class="wy_content">

            <!-- 轮播卡 -->
            <div class="wy_banner">
                <div>
                    <h3>探索更有意思的内容</h3>
                    <p>发现精选话题与课程更新</p>
                </div>
            </div>

            <!-- 功能宫格 -->
            <div class="wy_grid">
                <div class="wy_grid-item"><div class="wy_grid-icon"><i class="fa-solid fa-book"></i></div><span class="wy_grid-label">课程</span></div>
                <div class="wy_grid-item"><div class="wy_grid-icon"><i class="fa-solid fa-fire"></i></div><span class="wy_grid-label">热门</span></div>
                <div class="wy_grid-item"><div class="wy_grid-icon"><i class="fa-solid fa-star"></i></div><span class="wy_grid-label">收藏</span></div>
                <div class="wy_grid-item"><div class="wy_grid-icon"><i class="fa-solid fa-wrench"></i></div><span class="wy_grid-label">工具</span></div>
            </div>

            <!-- 最近动态列表 -->
            <h3 class="wy_list-title">最近动态</h3>
            <div class="wy_list">
                <div class="wy_list-item">
                    <div class="wy_list-avatar"><i class="fa-solid fa-code"></i></div>
                    <div class="wy_list-body"><h4>HTML 基础练习已更新</h4><p>新增语义化标签 section/article/aside 示例</p></div>
                    <span class="wy_list-time">2 分钟前</span>
                </div>
                <div class="wy_list-item">
                    <div class="wy_list-avatar"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                    <div class="wy_list-body"><h4>iconfont 字体图标上线</h4><p>课程资源已上传至 img/font 目录</p></div>
                    <span class="wy_list-time">1 小时前</span>
                </div>
                <div class="wy_list-item">
                    <div class="wy_list-avatar"><i class="fa-solid fa-rocket"></i></div>
                    <div class="wy_list-body"><h4>iconfont-4 正在开发中</h4><p>SVG 图标方式即将发布</p></div>
                    <span class="wy_list-time">今天</span>
                </div>
                <div class="wy_list-item">
                    <div class="wy_list-avatar"><i class="fa-solid fa-moon"></i></div>
                    <div class="wy_list-body"><h4>深色模式适配即将推出</h4><p>下一版本更新敬请期待</p></div>
                    <span class="wy_list-time">昨天</span>
                </div>
            </div>

        </main>

        <!-- 固定底部导航栏 -->
        <nav class="wy_tabbar" role="navigation" aria-label="底部导航">
            <div class="wy_tabbar-inner">

                <!-- Tab 1：首页（active + 红点） -->
                <button class="wy_tab is-active" data-wy-tab="home">
                    <i class="fa-solid fa-house"></i>
                    <span class="wy_tab-label">首页</span>
                    <span class="wy_badge wy_badge--dot" aria-label="有新内容"></span>
                </button>

                <!-- Tab 2：分类 -->
                <button class="wy_tab" data-wy-tab="category">
                    <i class="fa-solid fa-grid-2"></i>
                    <span class="wy_tab-label">分类</span>
                </button>

                <!-- Tab 3：消息（数字徽章 99+） -->
                <button class="wy_tab" data-wy-tab="message">
                    <i class="fa-regular fa-comment-dots"></i>
                    <span class="wy_tab-label">消息</span>
                    <span class="wy_badge">99+</span>
                </button>

                <!-- Tab 4：我的（数字徽章 5） -->
                <button class="wy_tab" data-wy-tab="mine">
                    <i class="fa-regular fa-user"></i>
                    <span class="wy_tab-label">我的</span>
                    <span class="wy_badge">5</span>
                </button>

            </div>
        </nav>

    </div>

    <script>
        // Tab 切换（仅视觉演示，不真正切换页面）
        (function () {
            var wy_tabs = document.querySelectorAll('.wy_tab');
            wy_tabs.forEach(function (wy_t) {
                wy_t.addEventListener('click', function () {
                    wy_tabs.forEach(function (wy_t2) { wy_t2.classList.remove('is-active'); });
                    wy_t.classList.add('is-active');
                });
            });
        })();
    </script>
</body>

</html>
